services:
  vllm:
    image: vllm/vllm-openai:gptoss
    container_name: vllm
    command: --model openai/gpt-oss-120b --gpu-memory-utilization 0.95
    pull_policy: always
    volumes:
      - /mnt/nvme/cache:/root/.cache
    networks:
      - open-webui
    environment:
      HF_HOME: /root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  mcpo-time:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo-time
    command: -- uvx mcp-server-time
    networks:
      - open-webui
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    networks:
      - open-webui
    depends_on:
      - vllm
      - mcpo-time
    ports:
      - 8080:8080
    environment:
      OPENAI_API_BASE_URL: http://vllm:8000/v1
    restart: unless-stopped

volumes:
  open-webui:
    name: open-webui

networks:
  open-webui:
    driver: bridge
